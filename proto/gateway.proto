syntax = "proto3";

package gateway;

option go_package = "github.com/mlund01/squadron-gateway-sdk/proto";

// GatewayService is implemented by the gateway plugin. Squadron calls
// these methods to push events / configure / control the gateway.
service GatewayService {
    // Configure passes settings from HCL config plus a broker stream id
    // the gateway can use to dial back for SquadronService access.
    rpc Configure(ConfigureRequest) returns (ConfigureResponse);

    // OnHumanInputRequested delivers a question for the gateway to present.
    rpc OnHumanInputRequested(HumanInputRecord) returns (Empty);

    // OnHumanInputResolved is invoked whenever a human-input request
    // transitions to resolved — including resolutions that came from
    // some other surface (commander, another gateway). The gateway
    // should update its external system to reflect the answer.
    rpc OnHumanInputResolved(HumanInputRecord) returns (Empty);

    // OnNotification is invoked when a mission reaches a terminal state
    // (completed, failed, stopped) and the mission opted into gateway
    // notifications. The gateway posts an informational message to its
    // external system. Unlike human-input, notifications are one-way:
    // there is nothing for the user to act on.
    rpc OnNotification(NotificationRecord) returns (Empty);

    // PostMessage posts a message using the payload format advertised by
    // MessageToolSpec. The returned message ID can be used with EditMessage.
    rpc PostMessage(PostMessageRequest) returns (PostMessageResponse);

    // MessageToolSpec returns a description and optional JSON Schema for
    // the message payload accepted by the gateway.
    rpc MessageToolSpec(Empty) returns (MessageToolSpecResponse);

    // EditMessage replaces a posted message using the ID returned by PostMessage.
    // Gateways with editing support implement this RPC.
    rpc EditMessage(EditMessageRequest) returns (Empty);

    // Shutdown asks the gateway to release external resources cleanly
    // before squadron tears down the subprocess.
    rpc Shutdown(Empty) returns (Empty);
}

// PostMessageRequest supplies the message payload and file attachments.
// The gateway interprets payload using the schema advertised by MessageToolSpec.
message PostMessageRequest {
    // Link to the individual run, when available.
    string run_url = 6;
    // Identifies a Squadron mission thread: a chain of related mission runs.
    string thread_id = 5;
    string payload = 1;
    repeated FileAttachment attachments = 2;
    // The individual run and task that authored the post. Empty outside a mission.
    string mission_id = 3;
    string task_id = 4;
}

// PostMessageResponse identifies the message a post created or replaced, in
// the gateway's own ID format. Empty when the gateway doesn't identify
// messages.
message PostMessageResponse {
    string message_id = 1;
}

// EditMessageRequest replaces the message identified by message_id, using the
// same payload format and attachment support as PostMessageRequest.
// mission_id and task_id identify the calling run and task.
message EditMessageRequest {
    // Link to the individual run, when available.
    string run_url = 7;
    // Identifies a Squadron mission thread: a chain of related mission runs.
    string thread_id = 6;
    string message_id = 1;
    string payload = 2;
    string mission_id = 3;
    string task_id = 4;
    repeated FileAttachment attachments = 5;
}

// FileAttachment supplies file content and metadata for upload by the gateway.
message FileAttachment {
    string filename = 1;
    string mime_type = 2;
    bytes content = 3;
}

// MessageToolSpecResponse describes the message payload accepted by the gateway.
message MessageToolSpecResponse {
    // description explains how to compose a message payload.
    string description = 1;
    // params_schema_json optionally defines the message payload as a JSON Schema object.
    string params_schema_json = 2;
}

// SquadronService provides question lookup and resolution through the host
// broker stream.
service SquadronService {
    // ListHumanInputs returns matching records. The `since` filter is
    // the primary catch-up mechanism: a gateway records the last event
    // timestamp it processed and asks for everything since.
    rpc ListHumanInputs(HumanInputFilter) returns (HumanInputList);

    // ResolveHumanInput records an answer from the gateway's external
    // system. Idempotent — calling twice returns alreadyResolved=true
    // with the original resolution intact, never an error.
    rpc ResolveHumanInput(ResolveHumanInputRequest) returns (ResolveHumanInputResponse);
}

message Empty {}

message ConfigureRequest {
    map<string, string> settings = 1;
    // BrokerStreamId is the broker stream the gateway should dial to
    // get a SquadronService client. Always non-zero.
    uint32 broker_stream_id = 2;
}

message ConfigureResponse {
    bool success = 1;
    string error = 2;
}

// HumanInputRecord carries a question, its resolution, and its mission context.
message HumanInputRecord {
    // Link to the individual run, when available.
    string run_url = 18;
    // Identifies a Squadron mission thread: a chain of related mission runs.
    string thread_id = 17;
    string id = 1;
    string mission_id = 2;
    string mission_name = 3;
    string task_id = 4;
    string task_name = 5;
    string tool_call_id = 6;
    string question = 7;
    string short_summary = 8;
    string additional_context = 9;
    repeated string choices = 10;
    string state = 11; // "open" | "resolved"
    string requested_at = 12; // RFC3339Nano
    string resolved_at = 13; // RFC3339Nano, empty if open
    string response = 14;
    string responder_user_id = 15;
    // multi_select=true means the human can pick 1+ from choices. The
    // resolved response is then a JSON-encoded array of strings
    // (e.g. `["A","C"]`) rather than a single value.
    bool multi_select = 16;
}

message HumanInputFilter {
    string state = 1;        // "open" | "resolved" | "" for both
    string mission_id = 2;
    string since = 3;        // RFC3339Nano — match requested_at|resolved_at >= since
    bool oldest_first = 4;
    int32 limit = 5;
    int32 offset = 6;
}

message HumanInputList {
    repeated HumanInputRecord items = 1;
    int32 total = 2;
}

message ResolveHumanInputRequest {
    string tool_call_id = 1;
    string response = 2;
    string responder_user_id = 3;
}

message ResolveHumanInputResponse {
    HumanInputRecord record = 1;
    // True when the request was already resolved before this call —
    // the record is the prior resolution, not a fresh one. Gateways
    // should treat this as success but display "already answered".
    bool already_resolved = 2;
    // True when the tool_call_id is unknown to squadron entirely.
    // Gateways should treat this as a stale event (e.g. the row was
    // trimmed) rather than retry.
    bool not_found = 3;
}

// NotificationRecord describes a single mission-lifecycle notification.
// All fields are flat strings so the schema stays language-neutral.
message NotificationRecord {
    // Link to the individual run, when available.
    string run_url = 10;
    // Identifies a Squadron mission thread: a chain of related mission runs.
    string thread_id = 9;
    string mission_id = 1;
    string mission_name = 2;
    // event is one of "mission_completed" or "mission_failed".
    string event = 3;
    string title = 4;
    string message = 5;
    string occurred_at = 6; // RFC3339Nano
    // error is set for "mission_failed", empty otherwise.
    string error = 7;
    // channel is an optional per-mission destination override. When
    // empty the gateway posts to its globally configured default
    // channel.
    string channel = 8;
}
